name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pytest
      # No Blender needed: vertex_weights() is pure arithmetic by design,
      # which is the point the tests exist to demonstrate.
      - run: python -m pytest tests/ -v
